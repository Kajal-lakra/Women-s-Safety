<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.relative {
    position: relative;
}

.h-screen {
    height: 100vh;
}

.w-full {
    width: 100%;
}

.bg-cover {
    background-size: cover;
}

.bg-center {
    background-position: center;
}

.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, black, rgba(0, 0, 0, 0.4), gray);
    opacity: 0.6;
}

.login-container {
    position: absolute;
    inset: 0;
    top: 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    padding: 20px;
    background: rgba(55, 65, 81, 0.3);
    backdrop-filter: blur(10px);
    border-radius: 10px;
}

.logo {
    color: #A855F7;
    font-size: 3rem;
    margin-bottom: 1rem;
    font-family: serif;
}

.login-header {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 1rem;
    color: #FFF;
}

.form-group {
    margin-bottom: 1rem;
}

label {
    color: #FFF;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #D1D5DB;
    border-radius: 5px;
    margin-top: 5px;
}

.form-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}

.remember-me {
    color: #D1D5DB;
}

button {
    background: none;
    border: none;
    color: #3B82F6;
    cursor: pointer;
}

.login-button {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    background: linear-gradient(to right, #A855F7, #3B82F6);
    color: #FFF;
    border: none;
    cursor: pointer;
}

.register-link {
    margin-top: 1rem;
    color: #D1D5DB;
}

.register-link a {
    color: #3B82F6;
    text-decoration: underline;
}

    </style>
</head>
<body>
    <div class="relative h-screen w-full bg-cover bg-center" style="background-image: url('./assets/bg.jpg');">
        <!-- Lightening Gradient Overlay -->
        <div class="overlay"></div>

        <!-- Centered Login Section -->
        <div class="login-container">
            <div class="logo">Angel Alert</div>
            <h1 class="login-header">Log in to your account</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Aadhar Number</label>
                    <input type="email" id="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your Password" required>
                </div>
                <div class="form-group">
                    <label for="password">Confirm Password</label>
                    <input type="password" id="password" placeholder="Your Password" required>
                </div>
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Remember Me
                    </label>
                    <button type="button" id="forgotPassword">Forgot Password?</button>
                </div>
                <button type="submit" class="login-button">Login</button>
            </form>
            <p class="register-link">
                Don't have an account? <a href="/Register">Register</a>
            </p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
